<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - Food Recipe</title>
  <link rel="stylesheet" href="signup.css">
</head>
<body>

<div class="container">

  <!-- Left Image -->
  <div class="image-section">
    <img src="https://images.unsplash.com/photo-1546069901-ba9599a7e63c" alt="Food Image">
  </div>

  <!-- Right Form Section -->
  <div class="form-section">
    <div class="form-box">

      <h1>Create Account ✨</h1>
      <p>Sign up to explore delicious recipes.</p>

      <!-- <form>
        <input type="text" placeholder="Full Name" required>
        <input type="email" placeholder="Email address" required>
        <input type="password" placeholder="Password" required>
        <input type="password" placeholder="Confirm Password" required>

        <button type="submit" class="main-btn">
          Sign Up
        </button>
      </form> -->
      <form>
  <input type="text" placeholder="Full Name" required>
  <input type="email" placeholder="Email address" required>

  <!-- Password -->
  <div class="password-box">
    <input type="password" id="password" placeholder="Password" required>
    <i class="fa-solid fa-eye" id="togglePassword"></i>
  </div>

  <!-- Confirm Password -->
  <div class="password-box">
    <input type="password" id="confirmPassword" placeholder="Confirm Password" required>
    <i class="fa-solid fa-eye" id="toggleConfirmPassword"></i>
  </div>

  <button type="submit" class="main-btn">
    Sign Up
  </button>
</form>


      <div class="divider">OR</div>

      <button class="social-btn">Sign up with Google</button>
      <button class="social-btn">Sign up with Facebook</button>

      <p class="switch-text">
        Already have an account? <a href="login.html">Login</a>
      </p>

    </div>
  </div>

</div>

</body>
</html>
