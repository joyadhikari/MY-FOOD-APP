<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Cart - Food Recipe</title>
  <link rel="stylesheet" href="cart.css">
</head>
<body>

<div class="container">

  <!-- Left Image Section -->
  <div class="image-section">
    <img src="https://images.unsplash.com/photo-1504674900247-0877df9cc836" alt="Food Image">
  </div>

  <!-- Right Cart Section -->
  <div class="cart-section">
    <div class="cart-box">

      <h1>🛒 My Cart</h1>
      <p>Review your selected delicious meals.</p>

      <!-- Cart Items -->
      <div class="cart-item">
        <div class="item-info">
          <h3>White Sauce Pasta</h3>
          <p>₹199</p>
        </div>
        <div class="quantity">
          <button>-</button>
          <span>1</span>
          <button>+</button>
        </div>
      </div>

      <div class="cart-item">
        <div class="item-info">
          <h3>Veg Burger</h3>
          <p>₹149</p>
        </div>
        <div class="quantity">
          <button>-</button>
          <span>2</span>
          <button>+</button>
        </div>
      </div>

      <!-- Total Section -->
      <div class="total">
        <h2>Total: ₹497</h2>
      </div>

      <button class="checkout-btn">Proceed to Checkout</button>

    </div>
  </div>

</div>

</body>
</html>
