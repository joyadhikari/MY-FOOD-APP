<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Food Recipe</title>
  <link rel="stylesheet" href="login.css">
</head>
<body>

<div class="container">
  
  <!-- Left Image Section -->
  <div class="image-section">
    <img src="https://images.unsplash.com/photo-1525755662778-989d0524087e" alt="Food Image">
  </div>

  <!-- Right Login Section -->
  <div class="form-section">
    <div class="form-box">
      <h1>Welcome Back 👋</h1>
      <p>Login to continue exploring delicious recipes.</p>

      <form>
        <input type="email" placeholder="Email address" required>
        <input type="password" placeholder="Password" required>
        
        <div class="forgot">
          <a href="#">Forgot password?</a>
        </div>

        <button type="submit" class="login-btn">Login</button>
      </form>

      <div class="divider">OR</div>

      <button class="google-btn">Login with Google</button>
      <button class="facebook-btn">Login with Facebook</button>

      <p class="signup-text">
        Don't have an account? <a href="signup.html">Sign up</a>
      </p>
    </div>
  </div>

</div>

</body>
</html>
